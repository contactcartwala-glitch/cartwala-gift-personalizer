# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ce0ab02aa2c699519934f02e1811a8f2"
name = "Cartwala Gift Personalizer"
application_url = "https://cartwala-gift-personalizer.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "products/create", "products/update" ]
  uri = "/webhooks/products/acrylic"

[access_scopes]
scopes = "read_files,read_orders,read_products,write_files,write_products,write_app_proxy"

[app_proxy]
url = "/signature-day"
prefix = "apps"
subpath = "cartwala-signature-day"

[auth]
redirect_urls = [ "https://cartwala-gift-personalizer.fly.dev/auth/callback" ]

[pos]
embedded = false

[product.metafields.app.personalizer_config]
type = "json"
name = "Cartwala Personalizer Configuration"
description = "Controls the Cartwala photo personalizer for this product"

  [product.metafields.app.personalizer_config.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[collection.metafields.app.acrylic_room]
type = "file_reference"
name = "Acrylic room background"
description = "Shared sofa background for every acrylic frame design"
access.admin = "merchant_read_write"
access.storefront = "public_read"
validations.file_type_options = ["Image"]

[shop.metafields.app.product_groups]
type = "json"
name = "Product Groups"
description = "Store-specific product matching, pricing and preview settings"
access.admin = "merchant_read_write"

[product.metafields.app.group_config]
type = "json"
name = "Product Group Preview"
description = "Published preview settings for this product"
access.admin = "merchant_read_write"
access.storefront = "public_read"
