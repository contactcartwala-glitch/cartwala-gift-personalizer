name: Deploy Fly backend

on:
  push:
    branches: [master]
    paths-ignore:
      - "qa/**"
      - ".github/workflows/site-ux-audit.yml"
      - ".github/workflows/summarize-last-ux-audit.yml"
      - ".github/workflows/deploy-shopify-app.yml"
      - ".github/workflows/deploy-fly.yml"
  workflow_dispatch:

concurrency:
  group: deploy-fly-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure public IPv4
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          flyctl ips allocate-v4 -a cartwala-gift-personalizer || true
          flyctl ips list -a cartwala-gift-personalizer

      - name: Deploy backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only -a cartwala-gift-personalizer
