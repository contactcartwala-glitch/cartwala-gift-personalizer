name: Summarize last UX audit

on:
  push:
    paths:
      - ".github/workflows/summarize-last-ux-audit.yml"
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download and summarize latest QA artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: "11460947853"
        run: |
          set -e
          gh api "/repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/qa.zip
          rm -rf /tmp/qa && mkdir -p /tmp/qa
          unzip -q /tmp/qa.zip -d /tmp/qa
          echo "=== COUNTS ==="
          jq '{discoveredUrls,checks,criticalCount,warningCount,issueCounts}' /tmp/qa/report.json
          echo "=== ALL CRITICAL ==="
          jq -r '.results[] as $r | $r.issues[] | select(.severity=="critical") | "CODE=\(.code)\nURL=\($r.url)\nBROWSER=\($r.browser) \($r.viewport.width)x\($r.viewport.height)\nMESSAGE=\(.message)\nEXAMPLES=\((.examples // [])|tojson)\n---"' /tmp/qa/report.json
          echo "=== WARNINGS BY CODE ==="
          jq -r '[.results[] as $r | $r.issues[] | select(.severity=="warning") | {code,url:$r.url,browser:$r.browser,viewport:$r.viewport,message,examples:(.examples // [])}] | group_by(.code) | map({code:.[0].code,count:length,examples:(.[0:4])}) | sort_by(-.count) | .[] | "CODE=\(.code) COUNT=\(.count)\n" + (.examples|map("  \(.browser) \(.viewport.width)x\(.viewport.height) \(.url) :: \(.message) :: \(.examples|tojson)")|join("\n"))' /tmp/qa/report.json
