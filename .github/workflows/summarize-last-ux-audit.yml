name: Summarize last UX audit

on:
  push:
    paths:
      - ".github/workflows/summarize-last-ux-audit.yml"
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download prior QA artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: "11460505697"
        run: |
          gh api "/repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/qa.zip
          mkdir -p /tmp/qa
          unzip -q /tmp/qa.zip -d /tmp/qa
          echo "=== SUMMARY.MD ==="
          cat /tmp/qa/summary.md
          echo "=== ISSUE COUNTS JSON ==="
          jq '{discoveredUrls,checks,criticalCount,warningCount,issueCounts}' /tmp/qa/report.json
          echo "=== TOP CRITICAL BY CODE ==="
          jq -r '[.results[] as $r | $r.issues[] | select(.severity=="critical") | {code,url:$r.url,browser:$r.browser,viewport:$r.viewport,message}] | group_by(.code) | map({code:.[0].code,count:length,examples:(.[0:8])}) | sort_by(-.count) | .[] | "CODE=\(.code) COUNT=\(.count)\n" + (.examples|map("  \(.browser) \(.viewport.width)x\(.viewport.height) \(.url) :: \(.message)")|join("\n"))' /tmp/qa/report.json
          echo "=== TOP WARNINGS BY CODE ==="
          jq -r '[.results[] as $r | $r.issues[] | select(.severity=="warning") | {code,url:$r.url,browser:$r.browser,viewport:$r.viewport,message}] | group_by(.code) | map({code:.[0].code,count:length,examples:(.[0:5])}) | sort_by(-.count) | .[] | "CODE=\(.code) COUNT=\(.count)\n" + (.examples|map("  \(.browser) \(.viewport.width)x\(.viewport.height) \(.url) :: \(.message)")|join("\n"))' /tmp/qa/report.json
