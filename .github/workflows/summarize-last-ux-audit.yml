name: Summarize last UX audit

on:
  push:
    paths:
      - ".github/workflows/summarize-last-ux-audit.yml"
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download prior QA artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: "11460947853"
        run: |
          gh api "/repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/qa.zip
          mkdir -p /tmp/qa
          unzip -q /tmp/qa.zip -d /tmp/qa
          echo "=== SUMMARY ==="
          cat /tmp/qa/summary.md
          echo "=== CRITICAL DETAILS ==="
          jq -r '.results[] as $r | $r.issues[] | select(.severity=="critical") | "CODE=\(.code)\nURL=\($r.url)\nBROWSER=\($r.browser) \($r.viewport.width)x\($r.viewport.height)\nMESSAGE=\(.message)\nEXAMPLES=\((.examples // [])|tojson)\n---"' /tmp/qa/report.json
          echo "=== WARNING COUNTS ==="
          jq -r '[.results[] as $r | $r.issues[] | select(.severity=="warning") | .code] | group_by(.) | map({code:.[0],count:length}) | sort_by(-.count) | .[] | "\(.code): \(.count)"' /tmp/qa/report.json
